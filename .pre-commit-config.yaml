# Local guardrails (secret scanning + hygiene), mirroring the backend.
# Requires the `pre-commit` tool: https://pre-commit.com  (`pre-commit install`).
# A Husky-based alternative is wired in a later phase for pure-JS setups.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
