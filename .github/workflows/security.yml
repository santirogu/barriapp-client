name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Required to publish results to Security → Code scanning.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast-sca:
    name: SAST & dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- Semgrep (SAST): SARIF for Code Scanning (reporting) ---
      - name: Semgrep (SARIF)
        run: |
          pipx run semgrep scan \
            --config p/javascript --config p/typescript \
            --config p/react --config p/security-audit \
            --sarif --output semgrep.sarif
        continue-on-error: true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # --- Dependency vulnerabilities (SCA, reporting) ---
      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
